<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>교육재단법인 설립 대시보드 — Project DX-Foundation</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <div class="header-bg-effects">
        <div class="header-blob1"></div>
        <div class="header-blob2"></div>
        <svg class="header-wave" preserveAspectRatio="none" viewBox="0 0 200 100">
          <path d="M0,0 Q100,120 200,40 V0 Z" fill="white"/>
          <path d="M60,0 Q140,80 200,20 V0 Z" fill="white" opacity="0.6"/>
          <path d="M120,0 Q160,50 200,10 V0 Z" fill="white" opacity="0.3"/>
        </svg>
      </div>
      <div class="header-left">
        <div class="header-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
            <polyline points="2 17 12 22 22 17"/>
            <polyline points="2 12 12 17 22 12"/>
          </svg>
        </div>
        <div>
          <span class="header-subtitle">Project DX-Foundation</span>
          <h1 class="header-title">교육재단법인 설립 대시보드</h1>
        </div>
      </div>
      <div class="header-right">
        <div class="view-toggle">
          <button class="view-toggle-btn" data-mode="overview" onclick="store.setViewMode('overview')">종합현황</button>
          <button class="view-toggle-btn active" data-mode="detail" onclick="store.setViewMode('detail')">상세현황</button>
        </div>
        <div class="header-date">최종 업데이트: 2026. 05. 22</div>
      </div>
    </header>

    <!-- Body -->
    <div id="body">
      <aside id="sidebar"></aside>
      <main id="main-content"></main>
      <div id="sim-area"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/overview.js"></script>
</body>
</html>
